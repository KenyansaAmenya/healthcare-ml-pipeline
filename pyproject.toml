[project]
name = "healthcare-ml-pipeline"
version = "1.0.0"
description = "Healthcare ML Pipeline with FastAPI, Supabase, and Render"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "supabase>=2.3.0",
    "pandas>=2.1.4",
    "numpy>=1.26.3",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.3",
    "joblib>=1.3.2",
    "apscheduler>=3.10.4",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "tenacity>=8.2.3",
    "gunicorn>=25.3.0",
]

