services:
  - type: web
    name: healthcare-ml-api
    runtime: docker
    dockerfilePath: ./Dockerfile  
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db  
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"  
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: models
      mountPath: /app/models
      sizeGB: 1

  - type: cron
    name: healthcare-model-retrain
    runtime: docker
    dockerfilePath: ./Dockerfile  
    schedule: "0 12 * * 6" 
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db  
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: APP_ENV
        value: production
    startCommand: python -m app.ml.trainer  

databases:
  - name: healthcare-db  
    databaseName: healthcare
    user: healthcare_user
    plan: starter